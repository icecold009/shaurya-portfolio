<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#0e1517"/><rect x="54" y="54" width="1092" height="642" rx="22" fill="#142124" stroke="#65e9a6" stroke-opacity=".32"/><text x="96" y="124" fill="#ecfff5" font-family="Arial" font-size="28" font-weight="700">CODE RACER</text><text x="96" y="166" fill="#9bc8b1" font-family="monospace" font-size="16">ROOM 04 / ROUND 02</text><rect x="96" y="226" width="694" height="342" rx="14" fill="#0b1113" stroke="#65e9a6" stroke-opacity=".25"/><text x="130" y="274" fill="#65e9a6" font-family="monospace" font-size="14">CHALLENGE / TWO POINTERS</text><g font-family="monospace" font-size="18"><text x="130" y="330" fill="#a8d7bb">01</text><text x="180" y="330" fill="#ecfff5">function solve(items) {</text><text x="130" y="370" fill="#a8d7bb">02</text><text x="180" y="370" fill="#cfb8ff">  let left = 0;</text><text x="130" y="410" fill="#a8d7bb">03</text><text x="180" y="410" fill="#cfb8ff">  let right = items.length - 1;</text><text x="130" y="450" fill="#a8d7bb">04</text><text x="180" y="450" fill="#ecfff5">  return pair(items, left, right);</text><text x="130" y="490" fill="#a8d7bb">05</text><text x="180" y="490" fill="#ecfff5">}</text></g><rect x="840" y="226" width="240" height="342" rx="14" fill="#1b3028"/><text x="872" y="274" fill="#9bc8b1" font-family="monospace" font-size="14">LIVE ROOM</text><circle cx="882" cy="332" r="8" fill="#65e9a6"/><text x="906" y="338" fill="#ecfff5" font-family="Arial" font-size="19">Maya</text><circle cx="882" cy="386" r="8" fill="#cfb8ff"/><text x="906" y="392" fill="#ecfff5" font-family="Arial" font-size="19">Arjun</text><rect x="872" y="466" width="176" height="54" rx="8" fill="#65e9a6"/><text x="908" y="501" fill="#0e1517" font-family="monospace" font-size="14" font-weight="700">SUBMIT</text></svg>
