<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#11151a"/><rect x="54" y="54" width="1092" height="642" rx="22" fill="#1a2028" stroke="#f0b36c" stroke-opacity=".35"/><text x="96" y="124" fill="#fff7eb" font-family="Arial" font-size="28" font-weight="700">OPEN SOURCE PRACTICE</text><text x="96" y="166" fill="#c8af91" font-family="monospace" font-size="16">FROM FIRST ISSUE TO REVIEWABLE PATCH</text><rect x="96" y="228" width="984" height="1" fill="#f0b36c" fill-opacity=".4"/><g font-family="monospace"><text x="96" y="294" fill="#f0b36c" font-size="14">01</text><text x="170" y="294" fill="#fff7eb" font-size="22">Find a focused issue</text><text x="170" y="330" fill="#9da9b8" font-size="15">Read the repository rules before touching code.</text><path d="M96 370h984" stroke="#44505d"/><text x="96" y="434" fill="#f0b36c" font-size="14">02</text><text x="170" y="434" fill="#fff7eb" font-size="22">Make a small branch</text><text x="170" y="470" fill="#9da9b8" font-size="15">Keep the change narrow, testable and easy to review.</text><path d="M96 510h984" stroke="#44505d"/><text x="96" y="574" fill="#f0b36c" font-size="14">03</text><text x="170" y="574" fill="#fff7eb" font-size="22">Open the conversation</text><text x="170" y="610" fill="#9da9b8" font-size="15">A good pull request explains the why as well as the diff.</text></g></svg>
