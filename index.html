    <!-- Critical boot loader: visible before the React bundle is ready. -->
    <style>
        :root {
            --loader-bg: #0b1220;
            --loader-surface: #121d30;
            --loader-line: #263650;
            --loader-text: #e9eef7;
            --loader-muted: #8d9bb2;
            --loader-accent: #7da8ff;
        }

        body {
            margin: 0;
            background: var(--loader-bg);
        }

        #app-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: grid;
            place-items: center;
            background: var(--loader-bg);
            color: var(--loader-text);
            font-family: "IBM Plex Mono", "Courier New", monospace;
            opacity: 1;
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        #app-loader.app-loader--hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .app-loader__content {
            width: min(34rem, calc(100% - 2.5rem));
        }

        .app-loader__topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            color: var(--loader-muted);
            font-size: 0.58rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .app-loader__spinner {
            --uib-size: 40px;
            --uib-color: var(--loader-accent);
            --uib-speed: 1.4s;
            --uib-bg-opacity: 0.14;
            display: block;
            width: var(--uib-size);
            height: var(--uib-size);
            margin: 1.5rem 0;
            overflow: visible;
            transform-origin: center;
        }

        .app-loader__spinner .track {
            fill: none;
            stroke: var(--uib-color);
            stroke-width: 4;
            opacity: var(--uib-bg-opacity);
            transition: stroke 0.5s ease;
        }

        .app-loader__spinner .car {
            fill: none;
            stroke: var(--uib-color);
            stroke-width: 4;
            stroke-dasharray: 15, 85;
            stroke-dashoffset: 0;
            stroke-linecap: round;
            animation: app-loader-travel var(--uib-speed) linear infinite;
            transition: stroke 0.5s ease;
            will-change: stroke-dasharray, stroke-dashoffset;
        }

        .app-loader__label {
            margin: 0 0 0.8rem;
            color: var(--loader-text);
            font-family: Arial, sans-serif;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        @keyframes app-loader-travel {
            0% {
                stroke-dashoffset: 0;
            }

            100% {
                stroke-dashoffset: -100;
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                --loader-bg: #f7f3e8;
                --loader-text: #172033;
                --loader-muted: #7a8699;
                --loader-accent: #2563eb;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #app-loader {
                transition: none;
            }

            .app-loader__spinner .car {
                animation: none;
            }
        }

        .app-loader__spinner {
            display: none;
        }

        .app-loader__label {
            margin: 1rem 0 1.35rem;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 650;
            letter-spacing: -0.06em;
        }

        .app-loader__grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .app-loader__card {
            display: block;
            padding: 0.65rem;
            border: 1px solid var(--loader-line);
            background: var(--loader-surface);
        }

        .app-loader__card::before,
        .app-loader__card::after {
            display: block;
            background: linear-gradient(
                100deg,
                color-mix(in srgb, var(--loader-muted) 10%, transparent) 20%,
                color-mix(in srgb, var(--loader-accent) 24%, transparent) 50%,
                color-mix(in srgb, var(--loader-muted) 10%, transparent) 80%
            );
            background-size: 220% 100%;
            content: "";
            animation: app-loader-shimmer 1.8s ease-in-out infinite;
        }

        .app-loader__card::before {
            aspect-ratio: 16 / 10;
        }

        .app-loader__card::after {
            width: 58%;
            height: 0.65rem;
            margin-top: 0.75rem;
        }

        @keyframes app-loader-shimmer {
            from {
                background-position: 100% 0;
            }

            to {
                background-position: -100% 0;
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                --loader-surface: #fffdf8;
                --loader-line: #d8d1c4;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .app-loader__card::before,
            .app-loader__card::after {
                animation: none;
            }
        }
    </style>
</head>
