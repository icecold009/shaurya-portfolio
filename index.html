<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Shaurya — Full-Stack Developer</title>
    <meta name="description"
        content="Student developer from Bengaluru building full-stack apps, AI tools, and music recognition systems. CS & A-Levels." />
    <meta name="author" content="Shaurya" />
    <meta name="theme-color" content="#060a06" />

    <!-- Open Graph (LinkedIn, WhatsApp, Slack previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shaurya.dev/" />
    <meta property="og:title" content="Shaurya — Full-Stack Developer" />
    <meta property="og:description"
        content="Student dev from Bengaluru. I build full-stack apps, AI-powered tools, and music recognition systems." />
    <meta property="og:image" content="https://shaurya.dev/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shaurya — Full-Stack Developer" />
    <meta name="twitter:description"
        content="Student dev from Bengaluru. Full-stack apps, AI tools, music recognition." />
    <meta name="twitter:image" content="https://shaurya.dev/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Critical boot loader: visible before the React bundle is ready. -->
    <style>
        :root {
            --loader-bg: #060a06;
            --loader-text: #e1f5e1;
            --loader-muted: #6d8a6d;
            --loader-accent: #00ff41;
        }

        body {
            margin: 0;
            background: var(--loader-bg);
        }

        #app-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: grid;
            place-items: center;
            background: var(--loader-bg);
            color: var(--loader-text);
            font-family: "JetBrains Mono", "Courier New", monospace;
            opacity: 1;
            transition: opacity 420ms ease, visibility 420ms ease;
        }

        #app-loader.app-loader--hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .app-loader__content {
            width: min(18rem, calc(100% - 3rem));
        }

        .app-loader__topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            color: var(--loader-muted);
            font-size: 0.58rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .app-loader__mark {
            display: grid;
            width: 3.25rem;
            height: 3.25rem;
            margin: 1.5rem 0;
            place-items: center;
            border: 1px solid color-mix(in srgb, var(--loader-accent) 45%, transparent);
            border-radius: 0.8rem;
            color: var(--loader-accent);
            font-family: Arial, sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            box-shadow: 0 0 2rem color-mix(in srgb, var(--loader-accent) 12%, transparent);
        }

        .app-loader__label {
            margin: 0 0 0.8rem;
            color: var(--loader-text);
            font-family: Arial, sans-serif;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        .app-loader__track {
            height: 1px;
            overflow: hidden;
            background: color-mix(in srgb, var(--loader-text) 16%, transparent);
        }

        .app-loader__progress {
            width: 42%;
            height: 100%;
            background: var(--loader-accent);
            animation: app-loader-progress 1.3s ease-in-out infinite;
        }

        @keyframes app-loader-progress {
            0% { transform: translateX(-120%); }
            55%, 100% { transform: translateX(280%); }
        }

        @media (prefers-color-scheme: light) {
            :root {
                --loader-bg: #f7f3e8;
                --loader-text: #172033;
                --loader-muted: #7a8699;
                --loader-accent: #2563eb;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #app-loader {
                transition: none;
            }

            .app-loader__progress {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div id="app-loader" role="status" aria-label="Loading portfolio">
        <div class="app-loader__content">
            <div class="app-loader__topline">
                <span>Shaurya Saria</span>
                <span>Portfolio / 2026</span>
            </div>
            <div class="app-loader__mark" aria-hidden="true">S</div>
            <p class="app-loader__label">Preparing the experience</p>
            <div class="app-loader__track" aria-hidden="true">
                <div class="app-loader__progress"></div>
            </div>
        </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
