    <!-- Critical boot loader: the first visit in a browser tab opens with a slow Hello introduction. -->
    <style>
        :root {
            color-scheme: dark;
            --loader-bg: #050706;
            --loader-text: #f5f5f0;
            --loader-muted: #90968f;
        }

        body {
            margin: 0;
            background: var(--loader-bg);
        }

        #app-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: grid;
            place-items: center;
            background: var(--loader-bg);
            color: var(--loader-text);
            font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
            opacity: 1;
            transition: opacity 500ms cubic-bezier(0.23, 1, 0.32, 1), visibility 500ms linear;
        }

        #app-loader.app-loader--hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        #root {
            opacity: 0;
            transform: translateY(0.5rem);
            transition: opacity 500ms cubic-bezier(0.23, 1, 0.32, 1), transform 500ms cubic-bezier(0.23, 1, 0.32, 1);
        }

        #root.app-loader__site-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .app-loader__content {
            width: min(58rem, calc(100% - 3rem));
            text-align: center;
        }

        .app-loader__topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            color: var(--loader-muted);
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: left;
        }

        .app-loader__hello {
            display: block;
            width: 100%;
            max-width: 52rem;
            height: auto;
            margin: clamp(2.5rem, 10vh, 6rem) auto clamp(2rem, 8vh, 4.5rem);
            overflow: visible;
        }

        .app-loader__hello-path {
            fill: none;
            stroke: url(#app-loader-hello-gradient);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1370px;
            stroke-dashoffset: 1370px;
            opacity: 0.55;
        }

        .app-loader__label {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .app-loader__skip {
            position: fixed;
            right: 1.5rem;
            bottom: 1.25rem;
            padding: 0.55rem 0.7rem;
            border: 1px solid rgba(245, 245, 240, 0.2);
            border-radius: 999px;
            background: transparent;
            color: var(--loader-muted);
            font: inherit;
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 160ms ease, color 160ms ease, background-color 160ms ease;
        }

        .app-loader__skip:hover,
        .app-loader__skip:focus-visible {
            border-color: rgba(245, 245, 240, 0.65);
            background: rgba(245, 245, 240, 0.08);
            color: var(--loader-text);
            outline: none;
        }

        @media (prefers-reduced-motion: reduce) {
            #app-loader {
                transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1), visibility 200ms linear;
            }

            .app-loader__hello-path {
                stroke-dasharray: none;
                stroke-dashoffset: 0;
                opacity: 1;
            }

            #root {
                transform: none;
                transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1);
            }

            .app-loader__skip {
                transition: none;
            }
        }

        @media (max-width: 40rem) {
            .app-loader__content {
                width: min(100% - 2rem, 32rem);
            }

            .app-loader__topline {
                font-size: 0.5rem;
            }

            .app-loader__hello {
                margin-top: 24vh;
                margin-bottom: 22vh;
            }
        }
    </style>
</head>

<body>
    <div id="app-loader" role="status" aria-label="Introducing Shaurya's portfolio">
        <div class="app-loader__content">
            <div class="app-loader__topline">
                <span>Shaurya Saria</span>
                <span>Portfolio / 2026</span>
            </div>
            <svg class="app-loader__hello" viewBox="80 40 360 210" aria-hidden="true">
                <defs>
                    <linearGradient id="app-loader-hello-gradient" x1="0%" y1="30%" x2="100%" y2="70%">
                        <stop offset="0%" stop-color="#050706" />
                        <stop offset="12%" stop-color="#42d36a" />
                        <stop offset="25%" stop-color="#f0d34c" />
                        <stop offset="37%" stop-color="#f28a48" />
                        <stop offset="50%" stop-color="#ed5c72" />
                        <stop offset="62%" stop-color="#f17cb2" />
                        <stop offset="75%" stop-color="#a56ce8" />
                        <stop offset="87%" stop-color="#4a9df5" />
                        <stop offset="100%" stop-color="#050706" />
                    </linearGradient>
                </defs>
                <path
                    class="app-loader__hello-path"
                    d="M98.5 207.7 C142.6 165.3 123.8 190.1 142.6 165.3 C157 146.3 164.6 120.7 158.8 109.7 C137.7 69.6 125.1 215.7 128.2 215.7 C131.2 215.7 131.1 173.2 146.6 163.6 C162.1 153.9 167.6 166.8 168.3 172.7 C169.5 182.4 164.8 197.8 165.6 203.4 C168.9 226.7 222.5 203.8 226.7 177.3 C231.2 148.8 191.5 150.1 199.4 195.7 C202.3 212.4 220.2 216.7 229.7 214.2 C264.2 205.2 287.9 158.9 287 123.4 C285.9 77.4 248.9 123.9 257.8 194.8 C261.2 222.1 290.4 213.2 299 205.9 C314.9 192.5 343 153.8 337.9 116.2 C332.5 77 292.1 141.6 310.7 200.3 C316.9 219.9 335.4 213.3 340.5 210.3 C352.6 203.1 356.5 177.2 366.1 165.8 C379.1 151.5 399 162.2 399.9 179.2 C401.7 216.8 375.2 216.8 365.4 208.3 C356.5 201 354.9 179.3 366.3 165.8 C374.2 156.6 386.7 156.4 403.2 166.7 C410.3 170.9 415.7 170.2 420.2 163.4"
                />
            </svg>
            <p class="app-loader__label" aria-live="polite">Hello animation. Portfolio loading.</p>
        </div>
        <button class="app-loader__skip" type="button">Skip intro</button>
    </div>
    <script>
        (() => {
            const loader = document.getElementById("app-loader");
            const introKey = "shaurya-portfolio:hello-intro-seen-v4";
            const introMode = new URLSearchParams(window.location.search).get("intro");
            const forceIntro = introMode === "show" || introMode === "animate";
            const forceAnimation = introMode === "animate";
            const introDurationMs = 10000;
            const handoffDurationMs = 500;

            if (!loader) {
                return;
            }

            const helloPath = loader.querySelector(".app-loader__hello-path");

            let introStorage = null;
            try {
                introStorage = window.sessionStorage;
            } catch {
                // Continue without persistence when storage is unavailable.
            }

            let seen = false;
            try {
                seen = !forceIntro && introStorage?.getItem(introKey) === "1";
            } catch {
                // Continue without persistence when storage is unavailable.
            }

            const reducedMotion = !forceAnimation && (window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches ?? false);
            let appReady = false;
            let introComplete = seen;
            let dismissed = false;
            let drawFrameId = 0;

            const rememberIntro = () => {
                try {
                    if (!forceIntro && introStorage) {
                        introStorage.setItem(introKey, "1");
                    }
                } catch {
                    // Storage is optional; the current visit can still finish.
                }
            };

            const dismiss = () => {
                if (dismissed || !appReady || !introComplete) {
                    return;
                }

                const focusPage = loader.contains(document.activeElement);
                const root = document.getElementById("root");
                dismissed = true;
                rememberIntro();

                if (root) {
                    root.classList.add("app-loader__site-visible");
                }

                if (seen) {
                    loader.remove();
                } else if (reducedMotion || !root) {
                    loader.classList.add("app-loader--hidden");
                    window.setTimeout(() => loader.remove(), reducedMotion ? 260 : handoffDurationMs + 60);
                } else {
                    const startedAt = window.performance.now();
                    loader.style.transition = "none";
                    root.style.transition = "none";
                    loader.style.opacity = "1";
                    root.style.opacity = "0";
                    root.style.transform = "translateY(0.5rem)";

                    const easeOut = (progress) => {
                        let lower = 0;
                        let upper = 1;
                        let time = progress;

                        for (let iteration = 0; iteration < 12; iteration += 1) {
                            const inverse = 1 - time;
                            const curveX = (3 * inverse * inverse * time * 0.23)
                                + (3 * inverse * time * time * 0.32)
                                + (time * time * time);

                            if (curveX < progress) {
                                lower = time;
                            } else {
                                upper = time;
                            }

                            time = (lower + upper) / 2;
                        }

                        const inverse = 1 - time;
                        return (3 * inverse * inverse * time)
                            + (3 * inverse * time * time)
                            + (time * time * time);
                    };

                    const revealFrame = (now) => {
                        const progress = Math.min((now - startedAt) / handoffDurationMs, 1);
                        const easedProgress = easeOut(progress);

                        loader.style.opacity = String(1 - easedProgress);
                        root.style.opacity = String(easedProgress);
                        root.style.transform = `translateY(${0.5 * (1 - easedProgress)}rem)`;

                        if (progress < 1) {
                            window.requestAnimationFrame(revealFrame);
                            return;
                        }

                        loader.classList.add("app-loader--hidden");
                        loader.remove();
                        root.style.removeProperty("transition");
                    };

                    window.requestAnimationFrame(revealFrame);
                }

                if (focusPage) {
                    document.getElementById("main-content")?.focus({ preventScroll: true });
                }
            };

            const maybeDismiss = () => {
                if (appReady && introComplete) {
                    dismiss();
                }
            };

            const completeIntro = () => {
                introComplete = true;
                maybeDismiss();
            };

            const drawHello = () => {
                const pathLength = 1370;
                const startedAt = window.performance.now();

                helloPath.style.strokeDasharray = `${pathLength}px`;
                helloPath.style.strokeDashoffset = `${pathLength}px`;
                helloPath.style.opacity = "0.55";

                const drawFrame = (now) => {
                    const progress = Math.min((now - startedAt) / introDurationMs, 1);
                    const easedProgress = 0.5 - (Math.cos(Math.PI * progress) / 2);

                    helloPath.style.strokeDashoffset = `${pathLength * (1 - easedProgress)}px`;
                    helloPath.style.opacity = String(0.55 + (0.45 * easedProgress));

                    if (progress < 1 && !introComplete) {
                        drawFrameId = window.requestAnimationFrame(drawFrame);
                        return;
                    }

                    completeIntro();
                };

                drawFrameId = window.requestAnimationFrame(drawFrame);
            };

            window.__appLoaderAppReady = () => {
                appReady = true;
                maybeDismiss();
            };

            if (seen) {
                loader.classList.add("app-loader--hidden");
            } else if (reducedMotion) {
                introComplete = true;
                window.setTimeout(maybeDismiss, 3000);
            } else if (!helloPath) {
                completeIntro();
            } else {
                drawHello();
            }

            const skipIntro = () => {
                window.cancelAnimationFrame(drawFrameId);
                completeIntro();
            };

            loader.querySelector(".app-loader__skip")?.addEventListener("click", skipIntro);
            window.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && !dismissed) {
                    skipIntro();
                }
            });
        })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
